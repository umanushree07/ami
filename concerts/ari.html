<div id="videoPopup" class="popup">

<span class="close" onclick="closePlayer()">✕</span>

<iframe id="videoFrame" allowfullscreen></iframe>

</div>

<script>

function openPlayer(video){
document.getElementById("videoPopup").style.display="flex";
document.getElementById("videoFrame").src=video;
}

function closePlayer(){
document.getElementById("videoPopup").style.display="none";
document.getElementById("videoFrame").src="";
}

</script>

<script>
function openTelegramPost(channel, postId) {
    document.getElementById("videoPopup").style.display = "flex";

    const container = document.getElementById("videoFrame");
    container.innerHTML = "";

    const script = document.createElement("script");
    script.async = true;
    script.src = "https://telegram.org/js/telegram-widget.js?22";
    script.setAttribute("data-telegram-post", channel + "/" + postId);
    script.setAttribute("data-width", "100%");

    container.appendChild(script);
}

function closePlayer() {
    document.getElementById("videoPopup").style.display = "none";
    document.getElementById("videoFrame").innerHTML = "";
}
</script>
